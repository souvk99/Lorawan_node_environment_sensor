; PlatformIO Project Configuration File for RAK4631 Environment Monitoring Node
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rak4630
boards_dir = rakwireless/boards

[env:rak4630]
platform = nordicnrf52
board = rak4630
framework = arduino

; Serial Monitor
monitor_speed = 115200

; Build source filter and include variant headers
build_src_filter = ${env.build_src_filter} +<../rakwireless/variants/rak4630>
build_flags = 
    -D LIB_DEBUG=0
    -I rakwireless/variants/rak4630

; Dependencies for LoRaWAN and environment sensors
lib_deps = 
    beegee-tokyo/SX126x-Arduino
    sparkfun/SparkFun SHTC3 Humidity and Temperature Sensor Library
    sparkfun/SparkFun SCD30 Arduino Library
    sensirion/Sensirion I2C SGP40
    sensirion/Sensirion Gas Index Algorithm
    sensirion/Sensirion Core
    Wire
    SPI
