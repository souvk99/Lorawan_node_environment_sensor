; PlatformIO Project Configuration File (Root Workspace)
; Points directly to the code and boards inside platformio_code/

[platformio]
default_envs = rak4630
boards_dir = platformio_code/rakwireless/boards
src_dir = platformio_code/src
include_dir = platformio_code/include
lib_dir = platformio_code/lib
data_dir = platformio_code/data
test_dir = platformio_code/test

[env:rak4630]
platform = nordicnrf52
board = rak4630
framework = arduino

; Serial Monitor
monitor_speed = 115200

; Build flags and variant sources
build_src_filter = ${env.build_src_filter} +<../rakwireless/variants/rak4630>
build_flags = 
    -D LIB_DEBUG=0
    -I platformio_code/rakwireless/variants/rak4630

; Dependencies for LoRaWAN and environment sensors
lib_deps = 
    beegee-tokyo/SX126x-Arduino
    sparkfun/SparkFun SHTC3 Humidity and Temperature Sensor Library
    sparkfun/SparkFun SCD30 Arduino Library
    sensirion/Sensirion I2C SGP40
    sensirion/Sensirion Gas Index Algorithm
    sensirion/Sensirion Core
    Wire
    SPI
